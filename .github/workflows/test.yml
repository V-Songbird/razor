name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: manifests parse
        run: node -e 'for (const f of [".claude-plugin/plugin.json",".codex-plugin/plugin.json","plugin.json","hooks/hooks.json","hooks/codex-hooks.json","hooks.json"]) JSON.parse(require("fs").readFileSync(f,"utf-8"))'

      - name: No benchmark tree in the package
        run: |
          if git ls-files | grep -iE '^\.?benchmarks/'; then
            echo "benchmark harnesses are not part of the plugin package"
            exit 1
          fi

      - name: Markdown anchors and README nav
        run: node scripts/git-hooks/check-readme-nav.js

      - name: run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test tests/*.test.js
  runtime-check:
    name: Runtime tests
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every runtime test job to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
