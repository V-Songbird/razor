name: Test

on:
  push:
    branches: [main, Codex]
  pull_request:
    branches: [main, Codex]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: manifests parse
        run: node -e 'for (const f of [".codex-plugin/plugin.json",".claude-plugin/plugin.json","hooks/hooks.json"]) JSON.parse(require("fs").readFileSync(f,"utf-8"))'

      - name: run tests
        run: node --test tests/*.test.js
