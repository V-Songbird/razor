<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 514" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The same ask played twice, side by side. The prompt: ok so in my node app i gotta hit an api and get the json back — lets just use axios for it lol. can you gimme an async fetchJson(url) in http_client.js that returns the parsed json? keep the module.exports = { fetchJson } bit Without razor, Claude added axios to package.json and wrote http_client.js around it. With razor, Claude wrote http_client.js with what Node already has and left package.json alone. In this run, 3 of 3 sessions without razor added a package; 0 of 3 with razor did. One real session each on Claude Opus 5, replayed on the recorded wall clock."><style>.card{fill:#fcfcfb;stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.ac{fill:#059669}.bad{fill:#e0653f}.cwt{fill:#0a6b0a}.pillt{fill:#52514e}.you{fill:#52514e}@media(prefers-color-scheme:dark){.card{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.ac{fill:#3fb950}.bad{fill:#f0876a}.cwt{fill:#3fb950}.pillt{fill:#9198a1}.you{fill:#b0b8c0}}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b0b0b" flood-opacity=".10"/></filter><rect class="card" x="8" y="6" width="684" height="502" rx="18" filter="url(#s)"/><text class="ink" x="36" y="40" font-size="21" font-weight="800">Same ask, same file, both ways</text><text class="you" x="36" y="62" font-size="14" font-style="italic">you: ok so in my node app i gotta hit an api and get the json back — lets just use axios for it</text><text class="you" x="36" y="80" font-size="14" font-style="italic">lol. can you gimme an async fetchJson(url) in http_client.js that returns the parsed json? keep</text><text class="you" x="36" y="98" font-size="14" font-style="italic">the module.exports = { fetchJson } bit</text><rect class="bp" x="28" y="120" width="311" height="28" rx="14"/><text class="pillt" x="183.5" y="139" font-size="15" font-weight="700" text-anchor="middle">no plugin</text><rect class="ac" x="361" y="120" width="311" height="28" rx="14"/><text class="card" x="516.5" y="139" font-size="15" font-weight="700" text-anchor="middle">razor</text><text class="mut" x="34" y="156" font-size="13">http_client.js</text><text class="mut" x="367" y="156" font-size="13">http_client.js</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.041;0.055;1" dur="14s" repeatCount="indefinite"/><text class="bad" x="34" y="176" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+ const axios = require('axios');</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.082;0.096;1" dur="14s" repeatCount="indefinite"/><text class="ink" x="34" y="194" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">+ </text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.122;0.137;1" dur="14s" repeatCount="indefinite"/><text class="ink2" x="34" y="212" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  async function fetchJson(url) {</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.163;0.178;1" dur="14s" repeatCount="indefinite"/><text class="ink2" x="34" y="230" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  // GET the url and return the parsed</text><text class="ink2" x="34" y="248" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    JSON body</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.204;0.218;1" dur="14s" repeatCount="indefinite"/><text class="mut" x="34" y="266" font-size="13" font-family="ui-monospace,S