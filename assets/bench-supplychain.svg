<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="More than 1.2 million malicious open-source packages blocked to date, and climbing; across 132 sessions razor opened zero doors into that pool"><style>.card{fill:#fcfcfb}.card{stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.cw{fill:#e3f2e3}.cwt{fill:#0a6b0a}.cf{fill:#f0efeb}.cft{fill:#52514e}.ac{fill:#059669}.bad{fill:#e0653f}@media(prefers-color-scheme:dark){.card{fill:#161b22}.card{stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.cw{fill:#17301f}.cwt{fill:#3fb950}.cf{fill:#2b2b29}.cft{fill:#9198a1}.ac{fill:#3fb950}}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b0b0b" flood-opacity=".10"/></filter><rect class="card" x="8" y="6" width="684" height="248" rx="18" filter="url(#s)"/><text class="ink" x="36" y="48" font-size="21" font-weight="800">Why an unnecessary dependency isn&#8217;t just clutter</text><text class="mut" x="36" y="70" font-size="14.5">every package you add is a door you now maintain</text><text class="ink" x="36" y="112" font-size="15.5" font-weight="600">malicious packages blocked</text><text class="mut" x="36" y="131" font-size="13">and climbing every year</text><text class="bad" x="664" y="118" font-size="30" font-weight="800" text-anchor="end">1,200,000+</text><text class="ink" x="36" y="170" font-size="15.5" font-weight="600">doors razor opened</text><text class="mut" x="36" y="189" font-size="13">across 132 benchmark sessions</text><text class="ac" x="664" y="176" font-size="30" font-weight="800" text-anchor="end">0</text><text class="ink2" x="36" y="218" font-size="14">Every dependency razor talks Claude out of is one fewer door into that pool.</text><text class="mut" x="36" y="240" font-size="13">Blocked-package count: Sonatype, 2026.</text></svg>
